name: CD Pipeline - Deploy to Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy-development:
    name: Deploy to Development Environment
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://term-project-dev.onrender.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render (Development)
        run: |
          echo "🚀 Deploying to Development environment..."
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"

      - name: Deployment Success
        run: |
          echo "✅ Development deployment triggered successfully!"
          echo "Environment: Development"
          echo "Branch: develop"
          echo "Service URL: https://term-project-dev.onrender.com"
