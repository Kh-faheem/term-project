name: Continuous Deployment to Render

on:
  push:
    branches:
      - develop
      - release
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Select environment
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            echo "SERVICE_ID=srv-d5n634mr433s739i8700" >> $GITHUB_ENV
            echo "ENV_NAME=Development" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == "refs/heads/release" ]]; then
            echo "SERVICE_ID=srv-d5n6bnq4d50c73dgjnc0" >> $GITHUB_ENV
            echo "ENV_NAME=QA" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "SERVICE_ID=srv-d5n6ffshg0os739l13l0" >> $GITHUB_ENV
            echo "ENV_NAME=Production" >> $GITHUB_ENV
          fi

      - name: Trigger Render Deployment
        run: |
          echo "Deploying to $ENV_NAME environment..."
          curl -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"
